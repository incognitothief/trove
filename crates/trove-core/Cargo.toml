[package]
name = "trove-core"
description = "Authoritative domain logic for Trove: reconcile, index, query, import, sync, export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Production S3-backed object store. Off by default to keep builds fast and
# tests hermetic/credential-free (ADR 001); opt in for production (ADR 003).
s3 = ["dep:aws-config", "dep:aws-sdk-s3", "dep:tokio"]

[dependencies]
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
unicode-normalization.workspace = true
rusqlite.workspace = true
sha2.workspace = true
uuid.workspace = true
chrono.workspace = true
dirs.workspace = true

# S3 backend (optional; enabled by the `s3` feature).
aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
